name: Restore original Velune public reader

# Restore the original reader without requesting the retired private source token.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: velune-pages
  cancel-in-progress: false

jobs:
  deploy-bridge:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4

      - name: Restore last successfully deployed public reader artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/velune-original dist
          gh run download 41197645945 --repo pino1472/Velune --name github-pages --dir /tmp/velune-original
          test -s /tmp/velune-original/artifact.tar
          tar -xf /tmp/velune-original/artifact.tar -C dist
          test -f dist/index.html
          test -f dist/works/revalna/index.html
          test -f dist/works/revalna/episodes/001.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - uses: actions/deploy-pages@v4
